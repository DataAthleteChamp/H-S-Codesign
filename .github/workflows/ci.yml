name: CI

on:
  push:
    branches: [main, jakubs-solution]
  pull_request:
    branches: [main, jakubs-solution]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            python/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -r python/requirements.txt
          fi

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        continue-on-error: true
        run: ruff check python/

      - name: Firmware preprocess regression check
        if: hashFiles('python/gen/model.tflite') != ''
        run: python -m python.bench.firmware_preprocess_check --tflite python/gen/model.tflite

      - name: Skip firmware preprocess check
        if: hashFiles('python/gen/model.tflite') == ''
        run: echo "python/gen/model.tflite is not checked in; skipping firmware preprocess check."
