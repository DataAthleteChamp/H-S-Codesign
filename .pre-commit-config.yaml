repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5120]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: ^python/.*\.py$

  - repo: local
    hooks:
      - id: clang-format-esp32-main
        name: clang-format esp32/main/*.cpp (optional, manual)
        entry: bash -c 'if command -v clang-format >/dev/null 2>&1; then clang-format -i "$@"; else echo "clang-format not installed; skipping"; fi' --
        language: system
        files: ^esp32/main/.*\.cpp$
        stages: [manual]
