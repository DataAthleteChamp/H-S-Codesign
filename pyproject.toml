# Project metadata + tooling configuration. Build/runtime dependencies live
# in python/requirements.txt - this file is for static analysis only.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "venv",
    "venv*/",
    "build",
    "dist",
    "python/gen",
    "python/__pycache__",
    "python/**/__pycache__",
    # Notebooks are committed without outputs but ruff still flags converted
    # cell expressions; treat them as black-box.
    "python/*.ipynb",
]

[tool.ruff.lint]
# Pragmatic ruleset:
#   E9      - syntax errors (always-on)
#   F63     - invalid type comparisons / wrong operator
#   F7      - syntactic errors (return outside function, etc.)
#   F82     - undefined-name (catches typos in symbols)
#   F401    - unused imports
#   F541    - f-strings without placeholders
#   F811    - redefined symbols
#   F841    - unused local variables
#   B       - flake8-bugbear (real bugs)
# We deliberately skip stylistic E/W rules (line length, whitespace) because
# the existing codebase does not follow them and forcing churn now would
# obscure substantive review at delivery time.
select = ["E9", "F63", "F7", "F82", "F401", "F541", "F811", "F841", "B"]

# `sys.path.insert(...)` is required at the top of bench scripts so they can
# import siblings without making `python/` a package. Allow E402 there.
[tool.ruff.lint.per-file-ignores]
"python/bench/*.py" = ["E402"]
"python/qat_export.py" = ["E402"]
"python/preview_pred.py" = ["F841"]
